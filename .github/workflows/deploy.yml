name: Next.js CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 3. Create deployment package
      - name: Create deployment package
        if: github.event_name == 'push'
        run: |
          tar -czf portfolio.tar.gz \
            --exclude='./portfolio.tar.gz' \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.env*' \
            --exclude='./.next' \
            .

      # 4. Upload package to HostSeba
      - name: Upload to HostSeba
        if: github.event_name == 'push'
        run: |
          scp -P ${{ secrets.SSH_PORT }} \
            portfolio.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/portfolio.tar.gz

      # 5. Deploy project to HostSeba
      - name: Deploy project
        if: github.event_name == 'push'
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             rm -rf .next && \
             tar -xzf /tmp/portfolio.tar.gz -C ${{ secrets.DEPLOY_PATH }} && \
             rm -f /tmp/portfolio.tar.gz && \
             npm ci && \
             npm run build"

      # 6. Restart cPanel Node.js application
      - name: Restart Node.js application
        if: github.event_name == 'push'
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "touch ${{ secrets.DEPLOY_PATH }}/tmp/restart.txt"
